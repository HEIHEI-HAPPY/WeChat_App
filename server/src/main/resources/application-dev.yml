# 开发环境：H2 内存库 + 本地 MinIO + 显示 SQL
spring:
  datasource:
    url: jdbc:h2:mem:mall;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update   # 启动时自动建表（学习用）
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

# Spring Boot DevTools（保存自动重启）
  devtools:
    restart:
      enabled: true
      additional-paths: src/main/java
    livereload:
      enabled: false

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE